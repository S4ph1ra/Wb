name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
env:
  # >>> Changez le nom de l'appli ici (evitez les symboles | et &) :
  APP_NAME: "WildCraft Bot"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Creer le projet Android
        run: |
            mkdir -p app
            cat > app/build.gradle.kts <<'WCEOF'
            plugins {
                id("com.android.application")
                id("org.jetbrains.kotlin.android")
            }
            android {
                namespace = "com.example.wcbot"
                compileSdk = 34
                defaultConfig {
                    applicationId = "com.example.wcbot"
                    minSdk = 26
                    targetSdk = 34
                    versionCode = 1
                    versionName = "1.0"
                }
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
                kotlinOptions { jvmTarget = "17" }
            }
            dependencies {
                implementation("com.google.mlkit:text-recognition:16.0.0")
            }
            WCEOF
            mkdir -p app/src/main
            cat > app/src/main/AndroidManifest.xml <<'WCEOF'
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
                <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
                <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

                <application
                    android:label="@string/app_name"
                    android:theme="@android:style/Theme.Material.NoActionBar">

                    <activity
                        android:name=".MainActivity"
                        android:exported="true"
                        android:resizeableActivity="true"
                        android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden"
                        android:screenOrientation="landscape">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>

                    <service
                        android:name=".BotService"
                        android:exported="false"
                        android:foregroundServiceType="mediaProjection" />

                    <service
                        android:name=".CalibService"
                        android:exported="false" />

                    <service
                        android:name=".BotAccessibility"
                        android:exported="true"
                        android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                        <intent-filter>
                            <action android:name="android.accessibilityservice.AccessibilityService" />
                        </intent-filter>
                        <meta-data
                            android:name="android.accessibilityservice"
                            android:resource="@xml/accessibility_config" />
                    </service>
                </application>
            </manifest>
            WCEOF
            mkdir -p app/src/main/java/com/example/wcbot
            cat > app/src/main/java/com/example/wcbot/BotAccessibility.kt <<'WCEOF'
            package com.example.wcbot

            import android.accessibilityservice.AccessibilityService
            import android.accessibilityservice.GestureDescription
            import android.content.Intent
            import android.graphics.Path
            import android.view.accessibility.AccessibilityEvent
            import java.util.concurrent.CountDownLatch

            class BotAccessibility : AccessibilityService() {
                companion object {
                    @Volatile var instance: BotAccessibility? = null
                }

                override fun onServiceConnected() { instance = this }
                override fun onUnbind(intent: Intent?): Boolean { instance = null; return super.onUnbind(intent) }
                override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
                override fun onInterrupt() {}

                private fun pointPath(x: Int, y: Int): Path = Path().apply { moveTo(x.toFloat(), y.toFloat()) }

                fun tap(x: Int, y: Int) {
                    val g = GestureDescription.Builder()
                        .addStroke(GestureDescription.StrokeDescription(pointPath(x, y), 0, 60))
                        .build()
                    dispatchGesture(g, null, null)
                }

                /** Mode joystick LIBRE : glisse de (jx,jy) vers (tx,ty), avec ou sans appui sur le bouton d'attaque. */
                fun moveAndAttack(jx: Int, jy: Int, tx: Int, ty: Int, ax: Int, ay: Int, durMs: Long, attack: Boolean) {
                    val joy = Path().apply { moveTo(jx.toFloat(), jy.toFloat()); lineTo(tx.toFloat(), ty.toFloat()) }
                    val b = GestureDescription.Builder()
                        .addStroke(GestureDescription.StrokeDescription(joy, 0, durMs))
                    if (attack) b.addStroke(GestureDescription.StrokeDescription(pointPath(ax, ay), 0, 60))
                    dispatchGesture(b.build(), null, null)
                }

                /**
                 * Mode joystick FIXE : pousse le joystick dans une direction et la maintient tant que keep()
                 * renvoie true. Si attack est vrai, un appui d'attaque est ajouté à chaque tranche.
                 * Un autre geste envoyé pendant ce temps coupe immédiatement le maintien. Bloquant.
                 */
                fun holdDirection(jx: Int, jy: Int, tx: Int, ty: Int, ax: Int, ay: Int, attack: Boolean, keep: () -> Boolean) {
                    val joyMove = Path().apply { moveTo(jx.toFloat(), jy.toFloat()); lineTo(tx.toFloat(), ty.toFloat()) }
                    val joyHold = Path().apply { moveTo(tx.toFloat(), ty.toFloat()) }
                    var j = GestureDescription.StrokeDescription(joyMove, 0, 300, true)
                    var cancelled = false
                    while (true) {
                        val latch = CountDownLatch(1)
                        val cb = object : AccessibilityService.GestureResultCallback() {
                            override fun onCompleted(g: GestureDescription?) { latch.countDown() }
                            override fun onCancelled(g: GestureDescription?) { cancelled = true; latch.countDown() }
                        }
                        val b = GestureDescription.Builder().addStroke(j)
                        if (attack) b.addStroke(GestureDescription.StrokeDescription(pointPath(ax, ay), 0, 60))
                        val ok = dispatchGesture(b.build(), cb, null)
                        if (!ok) return
                        latch.await()
                        if (cancelled) return
                        if (!keep()) {
                            j = j.continueStroke(joyHold, 0, 50, false)
                            dispatchGesture(GestureDescription.Builder().addStroke(j).build(), null, null)
                            return
                        }
                        j = j.continueStroke(joyHold, 0, 900, true)
                    }
                }
            }
            WCEOF
            mkdir -p app/src/main/java/com/example/wcbot
            cat > app/src/main/java/com/example/wcbot/BotService.kt <<'WCEOF'
            package com.example.wcbot

            import android.app.Notification
            import android.app.NotificationChannel
            import android.app.NotificationManager
            import android.app.Service
            import android.content.Intent
            import android.content.pm.ServiceInfo
            import android.graphics.Bitmap
            import android.graphics.PixelFormat
            import android.graphics.Typeface
            import android.graphics.drawable.GradientDrawable
            import android.hardware.display.DisplayManager
            import android.hardware.display.VirtualDisplay
            import android.media.ImageReader
            import android.media.projection.MediaProjection
            import android.media.projection.MediaProjectionManager
            import android.os.Build
            import android.os.Handler
            import android.os.IBinder
            import android.os.Looper
            import android.util.DisplayMetrics
            import android.view.Gravity
            import android.view.MotionEvent
            import android.view.View
            import android.view.ViewGroup
            import android.view.WindowManager
            import android.widget.Button
            import android.widget.LinearLayout
            import android.widget.ScrollView
            import android.widget.TextView
            import com.google.android.gms.tasks.Tasks
            import com.google.mlkit.vision.common.InputImage
            import com.google.mlkit.vision.text.TextRecognition
            import com.google.mlkit.vision.text.TextRecognizer
            import com.google.mlkit.vision.text.latin.TextRecognizerOptions
            import org.json.JSONArray
            import kotlin.math.abs
            import kotlin.math.cos
            import kotlin.math.sin

            class BotService : Service() {
                companion object {
                    const val ALIVE = 1
                    const val MISSING = 0
                    const val DEAD = -1
                    const val UNKNOWN = 2
                    const val GREEN = 0xFF00FF41.toInt()
                    const val DIM = 0xFF00B34A.toInt()
                    const val CYAN = 0xFF19D3FF.toInt()
                    const val AMBER = 0xFFFFB000.toInt()
                    const val RED = 0xFFFF4D4D.toInt()
                    const val SOFT = 0xFF9FE8B4.toInt()
                }

                private var projection: MediaProjection? = null
                private var reader: ImageReader? = null
                private var vd: VirtualDisplay? = null
                private var overlay: Button? = null
                private var boxOv: LinearLayout? = null
                private var lpOv: WindowManager.LayoutParams? = null
                private var mainBg: GradientDrawable? = null
                private var panelOv: View? = null
                private var statusTv: TextView? = null
                private var wm: WindowManager? = null
                @Volatile private var running = false
                @Volatile private var holding = false
                @Volatile private var gen = 0
                private var loopThread: Thread? = null
                private var w = 0
                private var h = 0
                private var recognizer: TextRecognizer? = null
                private var lastRaw = ""
                private var meMax = 0L

                /** Nombre de vie lu à l'écran : vie actuelle, et vie max si le jeu affiche "actuelle/max". */
                private class Hp(val cur: Long, val max: Long?)

                /** ScrollView qui ne dépasse pas une hauteur maximale. */
                private class MaxScroll(ctx: android.content.Context, val maxH: Int) : ScrollView(ctx) {
                    override fun onMeasure(widthSpec: Int, heightSpec: Int) {
                        super.onMeasure(widthSpec, View.MeasureSpec.makeMeasureSpec(maxH, View.MeasureSpec.AT_MOST))
                    }
                }

                override fun onBind(intent: Intent?): IBinder? = null

                override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                    if (intent?.action == "STOP") { stopSelf(); return START_NOT_STICKY }
                    L.init(this)
                    startNotif()
                    if (overlay != null) return START_NOT_STICKY
                    val code = intent?.getIntExtra("code", 0) ?: 0
                    val data = intent?.getParcelableExtra<Intent>("data")
                    if (data == null) { stopSelf(); return START_NOT_STICKY }
                    wm = getSystemService(WINDOW_SERVICE) as WindowManager
                    val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                    val p = mpm.getMediaProjection(code, data)
                    p.registerCallback(object : MediaProjection.Callback() {
                        override fun onStop() { running = false }
                    }, Handler(Looper.getMainLooper()))
                    projection = p
                    setupCapture()
                    recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                    showOverlay()
                    return START_NOT_STICKY
                }

                private fun startNotif() {
                    val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                    nm.createNotificationChannel(NotificationChannel("bot", "Bot", NotificationManager.IMPORTANCE_LOW))
                    val n = Notification.Builder(this, "bot")
                        .setContentTitle("WCB//NEXUS")
                        .setSmallIcon(android.R.drawable.ic_media_play)
                        .build()
                    if (Build.VERSION.SDK_INT >= 29) {
                        startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                    } else {
                        startForeground(1, n)
                    }
                }

                @Suppress("DEPRECATION")
                private fun setupCapture() {
                    val dm = DisplayMetrics()
                    wm!!.defaultDisplay.getRealMetrics(dm)
                    w = dm.widthPixels
                    h = dm.heightPixels
                    reader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                    vd = projection!!.createVirtualDisplay(
                        "bot", w, h, dm.densityDpi,
                        DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader!!.surface, null, null
                    )
                }

                private fun grab(): Bitmap? {
                    val img = reader?.acquireLatestImage() ?: return null
                    try {
                        val pl = img.planes[0]
                        val pad = pl.rowStride - pl.pixelStride * w
                        val wide = Bitmap.createBitmap(w + pad / pl.pixelStride, h, Bitmap.Config.ARGB_8888)
                        wide.copyPixelsFromBuffer(pl.buffer)
                        return if (pad == 0) wide else Bitmap.createBitmap(wide, 0, 0, w, h)
                    } finally {
                        img.close()
                    }
                }

                // ------------------------------------------------------------ lecture des nombres de vie
                private fun hasZone(p: String): Boolean {
                    val c = Store.cfg(this)
                    return c.contains(p + "1FX") && c.contains(p + "2FX")
                }

                private fun digitsOf(t: String): Long? {
                    val d = t.filter { it.isDigit() }
                    return if (d.isEmpty() || d.length > 12) null else d.toLong()
                }

                /** Lit le nombre dans la zone réglée (p = "hp" pour la cible, "me" pour moi). Sans internet. */
                private fun readZone(bmp: Bitmap, p: String): Hp? {
                    try {
                        if (!hasZone(p)) return null
                        val cfg = Store.cfg(this)
                        val x1 = (cfg.getFloat(p + "1FX", 0f) * w / 100f).toInt().coerceIn(0, w - 2)
                        val y1 = (cfg.getFloat(p + "1FY", 0f) * h / 100f).toInt().coerceIn(0, h - 2)
                        val x2 = (cfg.getFloat(p + "2FX", 0f) * w / 100f).toInt().coerceIn(x1 + 1, w)
                        val y2 = (cfg.getFloat(p + "2FY", 0f) * h / 100f).toInt().coerceIn(y1 + 1, h)
                        var crop = Bitmap.createBitmap(bmp, x1, y1, x2 - x1, y2 - y1)
                        if (crop.height < 64) {
                            val k = minOf(4, (64 + crop.height - 1) / crop.height)
                            crop = Bitmap.createScaledBitmap(crop, crop.width * k, crop.height * k, true)
                        }
                        val rec = recognizer ?: return null
                        val text = Tasks.await(rec.process(InputImage.fromBitmap(crop, 0))).text
                        if (p == "hp") lastRaw = text.replace("\n", " ").trim()
                        val line = text.lines().firstOrNull { l -> l.any { it.isDigit() || it == 'O' || it == 'o' || it == 'l' || it == 'I' } }
                            ?: return null
                        val fixed = line.replace('O', '0').replace('o', '0').replace('l', '1').replace('I', '1')
                        val parts = fixed.split('/')
                        val cur = digitsOf(parts[0]) ?: return null
                        val max = if (parts.size > 1) digitsOf(parts[1]) else null
                        return Hp(cur, max)
                    } catch (e: Exception) {
                        return null
                    }
                }

                /** Ma vie en % : avec "actuelle/max" si le jeu l'affiche, sinon par rapport au plus grand nombre déjà vu. */
                private fun selfPct(bmp: Bitmap): Int? {
                    val hp = readZone(bmp, "me") ?: return null
                    var max = hp.max ?: 0L
                    if (max <= 0L) {
                        if (hp.cur > meMax) meMax = hp.cur
                        max = meMax
                    }
                    if (max <= 0L) return null
                    return minOf(100L, hp.cur * 100L / max).toInt()
                }

                // ------------------------------------------------------------ bouton flottant + console
                private fun setLabel(t: String) {
                    overlay?.post {
                        if (running) {
                            overlay?.text = t
                            statusTv?.text = t
                            val hot = t.contains("BOSS") || t.contains("MID") || t.contains("LOOT")
                            mainBg?.setStroke(3, if (hot) AMBER else GREEN)
                        }
                    }
                }

                private fun pill(color: Int, fill: Int): GradientDrawable {
                    val d = GradientDrawable()
                    d.setColor(fill)
                    d.setStroke(3, color)
                    d.cornerRadius = 14f
                    return d
                }

                private fun smallButton(t: String): Button {
                    val b = Button(this)
                    b.text = t
                    b.setAllCaps(false)
                    b.typeface = Typeface.MONOSPACE
                    b.textSize = 12f
                    b.minWidth = 0
                    b.minHeight = 0
                    b.setPadding(24, 10, 24, 10)
                    b.setTextColor(GREEN)
                    b.background = pill(GREEN, 0xCC050A05.toInt())
                    return b
                }

                private fun panelLabel(t: String, color: Int): TextView {
                    val tv = TextView(this)
                    tv.text = t
                    tv.typeface = Typeface.MONOSPACE
                    tv.textSize = 12f
                    tv.setTextColor(color)
                    return tv
                }

                private fun topMargin(px: Int): LinearLayout.LayoutParams {
                    val l = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                    l.topMargin = px
                    return l
                }

                private fun stepper(name: String, key: String, def: Int, step: Int, min: Int, max: Int, wrap: Boolean): LinearLayout {
                    val cfg = Store.cfg(this)
                    val row = LinearLayout(this)
                    row.orientation = LinearLayout.HORIZONTAL
                    row.gravity = Gravity.CENTER_VERTICAL
                    val tv = panelLabel(name, SOFT)
                    tv.minWidth = 230
                    val value = TextView(this)
                    value.typeface = Typeface.MONOSPACE
                    value.textSize = 13f
                    value.setTextColor(GREEN)
                    value.gravity = Gravity.CENTER
                    value.minWidth = 130
                    value.text = cfg.getInt(key, def).toString()
                    val minus = smallButton("−")
                    val plus = smallButton("+")
                    fun change(delta: Int) {
                        var v = cfg.getInt(key, def) + delta
                        if (wrap) {
                            if (v < min) v = max
                            if (v > max) v = min
                        } else {
                            v = v.coerceIn(min, max)
                        }
                        cfg.edit().putInt(key, v).apply()
                        value.text = v.toString()
                    }
                    minus.setOnClickListener { change(-step) }
                    plus.setOnClickListener { change(step) }
                    row.addView(tv)
                    row.addView(minus)
                    row.addView(value)
                    row.addView(plus)
                    return row
                }

                private fun toggleRow(name: String, key: String, onT: String, offT: String, def: Int): Button {
                    val cfg = Store.cfg(this)
                    val b = smallButton("")
                    fun refresh() { b.text = name + " : " + (if (cfg.getInt(key, def) == 1) onT else offT) }
                    refresh()
                    b.setOnClickListener {
                        cfg.edit().putInt(key, if (cfg.getInt(key, def) == 1) 0 else 1).apply()
                        refresh()
                    }
                    return b
                }

                private fun buildPanel(): View {
                    val p = LinearLayout(this)
                    p.orientation = LinearLayout.VERTICAL
                    p.setPadding(24, 18, 24, 18)
                    p.addView(panelLabel(L.t("o_title"), CYAN))
                    val st = panelLabel("", SOFT)
                    st.textSize = 11f
                    statusTv = st
                    p.addView(st, topMargin(4))
                    p.addView(panelLabel(L.t("o_hint"), DIM), topMargin(2))

                    // langue
                    val langRow = LinearLayout(this)
                    langRow.orientation = LinearLayout.HORIZONTAL
                    for (code in listOf("fr", "en")) {
                        val b = smallButton(code.uppercase())
                        if (L.lang == code) b.background = pill(GREEN, 0xFF123A18.toInt())
                        b.setOnClickListener { L.set(this, code); rebuildPanel() }
                        val l = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                        l.rightMargin = 8
                        langRow.addView(b, l)
                    }
                    p.addView(langRow, topMargin(10))

                    p.addView(panelLabel(L.t("o_threat"), CYAN), topMargin(16))
                    p.addView(stepper(L.t("o_hp"), "hpBoss", 10000, 5000, 1000, 1000000, false), topMargin(6))
                    p.addView(stepper(L.t("o_big"), "hpBig", 100000, 10000, 1000, 10000000, false), topMargin(6))
                    p.addView(stepper(L.t("o_dir"), "dir", 0, 15, 0, 345, true), topMargin(6))
                    p.addView(stepper(L.t("o_radius"), "radius", 90, 10, 20, 300, false), topMargin(6))
                    p.addView(toggleRow(L.t("o_atk"), "atkBoss", L.t("o_yes"), L.t("o_no"), 0), topMargin(8))
                    p.addView(toggleRow(L.t("o_joy"), "fixed", L.t("o_fixed"), L.t("o_free"), 1), topMargin(6))

                    p.addView(panelLabel(L.t("o_vitals"), CYAN), topMargin(16))
                    p.addView(toggleRow(L.t("o_surv"), "surv", L.t("o_yes"), L.t("o_no"), 0), topMargin(6))
                    p.addView(stepper(L.t("o_low"), "selfLow", 40, 5, 5, 95, false), topMargin(6))
                    p.addView(stepper(L.t("o_resume"), "selfResume", 70, 5, 10, 100, false), topMargin(6))
                    p.addView(stepper(L.t("o_flee"), "dirFlee", 180, 15, 0, 345, true), topMargin(6))

                    p.addView(panelLabel(L.t("o_loot"), CYAN), topMargin(16))
                    p.addView(toggleRow(L.t("o_lootT"), "loot", L.t("o_yes"), L.t("o_no"), 0), topMargin(6))
                    val run = smallButton(L.t("o_run"))
                    run.setOnClickListener {
                        val g = gen
                        Thread { try { runLoot(g, true) } catch (e: Exception) {} }.start()
                    }
                    p.addView(run, topMargin(8))

                    val q = smallButton(L.t("o_quit"))
                    q.setTextColor(RED)
                    q.background = pill(RED, 0xCC050A05.toInt())
                    q.setOnClickListener { stopSelf() }
                    p.addView(q, topMargin(16))

                    val sv = MaxScroll(this, (h * 0.6).toInt())
                    val bg = GradientDrawable()
                    bg.setColor(0xEE050A05.toInt())
                    bg.setStroke(3, GREEN)
                    bg.cornerRadius = 16f
                    sv.background = bg
                    sv.isVerticalScrollBarEnabled = false
                    sv.addView(p)
                    return sv
                }

                private fun rebuildPanel() {
                    val box = boxOv ?: return
                    val old = panelOv
                    val wasVisible = old?.visibility == View.VISIBLE
                    if (old != null) box.removeView(old)
                    val np = buildPanel()
                    np.visibility = if (wasVisible) View.VISIBLE else View.GONE
                    box.addView(np, topMargin(10))
                    panelOv = np
                }

                /** Rend une vue déplaçable au doigt : appui court = onTap, appui long immobile = onLong. */
                private fun drag(v: View, onTap: () -> Unit, onLong: () -> Unit) {
                    var downX = 0f
                    var downY = 0f
                    var startX = 0
                    var startY = 0
                    var moved = false
                    var long = false
                    val handler = Handler(Looper.getMainLooper())
                    val longRun = Runnable { long = true; onLong() }
                    v.setOnTouchListener { _, ev ->
                        val p = lpOv
                        if (p != null) {
                            when (ev.action) {
                                MotionEvent.ACTION_DOWN -> {
                                    downX = ev.rawX
                                    downY = ev.rawY
                                    startX = p.x
                                    startY = p.y
                                    moved = false
                                    long = false
                                    handler.postDelayed(longRun, 900)
                                }
                                MotionEvent.ACTION_MOVE -> {
                                    val dx = ev.rawX - downX
                                    val dy = ev.rawY - downY
                                    if (!moved && (abs(dx) > 14 || abs(dy) > 14)) {
                                        moved = true
                                        handler.removeCallbacks(longRun)
                                    }
                                    if (moved) {
                                        p.x = startX + dx.toInt()
                                        p.y = startY + dy.toInt()
                                        try { wm?.updateViewLayout(boxOv, p) } catch (e: Exception) {}
                                    }
                                }
                                MotionEvent.ACTION_UP -> {
                                    handler.removeCallbacks(longRun)
                                    if (moved) {
                                        Store.cfg(this).edit().putInt("ovX", p.x).putInt("ovY", p.y).apply()
                                    } else if (!long) {
                                        onTap()
                                    }
                                }
                                MotionEvent.ACTION_CANCEL -> handler.removeCallbacks(longRun)
                            }
                        }
                        true
                    }
                }

                private fun showOverlay() {
                    val cfg = Store.cfg(this)
                    val box = LinearLayout(this)
                    box.orientation = LinearLayout.VERTICAL

                    val row = LinearLayout(this)
                    row.orientation = LinearLayout.HORIZONTAL
                    val b = smallButton("▶")
                    val bg = pill(DIM, 0xCC050A05.toInt())
                    b.background = bg
                    mainBg = bg
                    val menu = smallButton("≡")
                    row.addView(b)
                    val lpMenu = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                    lpMenu.leftMargin = 10
                    row.addView(menu, lpMenu)
                    box.addView(row)
                    boxOv = box

                    val panel = buildPanel()
                    panel.visibility = View.GONE
                    box.addView(panel, topMargin(10))
                    panelOv = panel

                    val lp = WindowManager.LayoutParams(
                        ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                        WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                        PixelFormat.TRANSLUCENT
                    )
                    lp.gravity = Gravity.TOP or Gravity.START
                    lp.x = cfg.getInt("ovX", 20)
                    lp.y = cfg.getInt("ovY", 20)
                    lpOv = lp
                    drag(b, { toggle() }, { stopSelf() })
                    drag(menu, {
                        val pn = panelOv
                        if (pn != null) pn.visibility = if (pn.visibility == View.GONE) View.VISIBLE else View.GONE
                    }, {})
                    wm!!.addView(box, lp)
                    overlay = b
                }

                private fun toggle() {
                    if (running) {
                        running = false
                        gen++
                        overlay?.text = "▶"
                        mainBg?.setStroke(3, DIM)
                    } else {
                        gen++
                        val g = gen
                        running = true
                        overlay?.text = "■"
                        val t = Thread { try { loop(g) } catch (e: Exception) {} }
                        loopThread = t
                        t.start()
                    }
                }

                private fun active(g: Int): Boolean = running && gen == g

                // ------------------------------------------------------------ logique de jeu
                private fun px(key: String, def: Float, total: Int): Int = (Store.cfg(this).getFloat(key, def) * total / 100f).toInt()

                private fun loop(g: Int) {
                    val cfg = Store.cfg(this)
                    val btnX = px("btnFX", 90f, w)
                    val btnY = px("btnFY", 70f, h)
                    var lastPet = 0L
                    var noImage = 0
                    meMax = 0L
                    while (active(g)) {
                        val bmp = grab()
                        if (bmp == null) {
                            noImage++
                            if (noImage == 10) setLabel("■ " + L.t("o_noimg"))
                            Thread.sleep(200)
                            continue
                        }
                        noImage = 0
                        val hp = readZone(bmp, "hp")
                        if (hp == null) {
                            setLabel("■ " + L.t("o_nonum") + " (" + lastRaw.take(14) + ")")
                            Thread.sleep(300)
                            continue
                        }
                        val bossMin = cfg.getInt("hpBoss", 10000).toLong()
                        val big = cfg.getInt("hpBig", 100000).toLong()
                        val surv = cfg.getInt("surv", 0) == 1 && hasZone("me")
                        val ref = hp.max ?: hp.cur
                        val kind = if (ref < bossMin) L.t("o_npc") else if (surv && ref < big) "MID" else "BOSS"
                        val acc = if (BotAccessibility.instance == null) " | " + L.t("o_accoff") else ""
                        setLabel("■ " + L.t("o_life") + " " + hp.cur + (if (hp.max != null) "/" + hp.max else "") + " → " + kind + acc)
                        if (hp.cur > 0) {
                            if (ref < bossMin) {
                                if (System.currentTimeMillis() - lastPet > 2000) {
                                    BotAccessibility.instance?.tap(btnX, btnY)
                                    lastPet = System.currentTimeMillis()
                                }
                            } else if (surv && ref < big) {
                                if (fightSmall(g)) runLoot(g, false)
                            } else {
                                val killed = circleBoss(g) {
                                    val b2 = grab()
                                    if (b2 == null) {
                                        UNKNOWN
                                    } else {
                                        val h2 = readZone(b2, "hp")
                                        setLabel("■ BOSS " + L.t("o_life") + " " + (if (h2 != null) h2.cur.toString() else "?"))
                                        if (h2 == null) MISSING else if (h2.cur <= 0) DEAD else ALIVE
                                    }
                                }
                                if (killed) runLoot(g, false)
                            }
                        }
                        Thread.sleep(300)
                    }
                }

                /** Petit boss : l'animal attaque ; si MA vie passe sous le seuil, mon perso bouge jusqu'à ce qu'elle remonte. */
                private fun fightSmall(g: Int): Boolean {
                    val cfg = Store.cfg(this)
                    val jx = px("joyFX", 15f, w)
                    val jy = px("joyFY", 70f, h)
                    val btnX = px("btnFX", 90f, w)
                    val btnY = px("btnFY", 70f, h)
                    val r = cfg.getInt("radius", 90)
                    val rad = Math.toRadians(cfg.getInt("dirFlee", 180).toDouble())
                    val tx = jx + (r * cos(rad)).toInt()
                    val ty = jy + (r * sin(rad)).toInt()
                    val low = cfg.getInt("selfLow", 40)
                    val resume = cfg.getInt("selfResume", 70)
                    val maxMiss = cfg.getInt("bossMiss", 4)
                    var fleeing = false
                    var fleeThread: Thread? = null
                    var missing = 0
                    var dead = 0
                    var lastPet = 0L
                    var killed = false

                    fun startFlee() {
                        if (fleeing) return
                        fleeing = true
                        holding = true
                        val t = Thread {
                            try {
                                BotAccessibility.instance?.holdDirection(jx, jy, tx, ty, 0, 0, false) { holding && active(g) }
                            } catch (e: Exception) {}
                        }
                        fleeThread = t
                        t.start()
                    }

                    fun stopFlee() {
                        if (!fleeing) return
                        fleeing = false
                        holding = false
                        BotAccessibility.instance?.tap(jx, jy)
                        try { fleeThread?.join(3000) } catch (e: Exception) {}
                        fleeThread = null
                    }

                    while (active(g) && missing < maxMiss) {
                        val bmp = grab()
                        if (bmp != null) {
                            val t = readZone(bmp, "hp")
                            val me = selfPct(bmp)
                            if (t == null) {
                                missing++
                            } else if (t.cur <= 0) {
                                dead++
                                if (dead >= 2) { killed = true; break }
                            } else {
                                missing = 0
                                dead = 0
                            }
                            if (me != null) {
                                if (!fleeing && me < low) startFlee()
                                else if (fleeing && me >= resume) stopFlee()
                            }
                            val tv = if (t != null) t.cur.toString() else "?"
                            val mv = if (me != null) me.toString() else "?"
                            setLabel("■ MID " + L.t("o_life") + " " + tv + " | " + L.t("o_me") + " " + mv + "%" + (if (fleeing) " ▶▶" else ""))
                        }
                        if (!fleeing && System.currentTimeMillis() - lastPet > 2000) {
                            BotAccessibility.instance?.tap(btnX, btnY)
                            lastPet = System.currentTimeMillis()
                        }
                        Thread.sleep(300)
                    }
                    stopFlee()
                    return killed
                }

                /** Gros boss : tourne autour tant que alive() ne dit pas que le boss est fini. Renvoie true s'il est mort. */
                private fun circleBoss(g: Int, alive: () -> Int): Boolean {
                    val cfg = Store.cfg(this)
                    val jx = px("joyFX", 15f, w)
                    val jy = px("joyFY", 70f, h)
                    val ax = px("btnFX", 90f, w)
                    val ay = px("btnFY", 70f, h)
                    val r = cfg.getInt("radius", 90)
                    val fixed = cfg.getInt("fixed", 1) == 1
                    val maxMiss = cfg.getInt("bossMiss", 4)
                    val attack = cfg.getInt("atkBoss", 0) == 1
                    var missing = 0
                    var dead = 0

                    if (fixed) {
                        val rad = Math.toRadians(cfg.getInt("dir", 0).toDouble())
                        val tx = jx + (r * cos(rad)).toInt()
                        val ty = jy + (r * sin(rad)).toInt()
                        holding = true
                        val t = Thread {
                            try {
                                BotAccessibility.instance?.holdDirection(jx, jy, tx, ty, ax, ay, attack) { holding && active(g) }
                            } catch (e: Exception) {}
                        }
                        t.start()
                        while (active(g) && missing < maxMiss) {
                            Thread.sleep(300)
                            val a = alive()
                            if (a == ALIVE) { missing = 0; dead = 0 }
                            else if (a == MISSING) missing++
                            else if (a == DEAD) { dead++; if (dead >= 2) missing = maxMiss }
                        }
                        holding = false
                        // un nouveau geste coupe aussitôt le maintien : le joystick est relâché tout de suite
                        BotAccessibility.instance?.tap(jx, jy)
                        try { t.join(3000) } catch (e: Exception) {}
                        return dead >= 2
                    }

                    var angle = 0.0
                    while (active(g) && missing < maxMiss) {
                        angle = (angle + 25.0) % 360.0
                        val rad = Math.toRadians(angle)
                        val tx = jx + (r * cos(rad)).toInt()
                        val ty = jy + (r * sin(rad)).toInt()
                        BotAccessibility.instance?.moveAndAttack(jx, jy, tx, ty, ax, ay, 300, attack)
                        Thread.sleep(340)
                        val a = alive()
                        if (a == ALIVE) { missing = 0; dead = 0 }
                        else if (a == MISSING) missing++
                        else if (a == DEAD) { dead++; if (dead >= 2) missing = maxMiss }
                    }
                    return dead >= 2
                }

                /** Après la mort d'un boss : rejoue la séquence d'appuis enregistrée (ouvrir les coffres). */
                private fun runLoot(g: Int, force: Boolean) {
                    val cfg = Store.cfg(this)
                    if (!force && cfg.getInt("loot", 0) != 1) return
                    val acc = BotAccessibility.instance ?: return
                    val pts = try { JSONArray(cfg.getString("lootPts", "[]")) } catch (e: Exception) { JSONArray() }
                    if (pts.length() == 0) return
                    val first = if (force) 500L else cfg.getInt("lootStart", 2000).toLong()
                    val delay = cfg.getInt("lootDelay", 800).toLong()
                    val repeat = cfg.getInt("lootRepeat", 1).coerceIn(1, 30)
                    setLabel("■ " + L.t("o_loot_run"))
                    Thread.sleep(first)
                    for (r in 0 until repeat) {
                        for (i in 0 until pts.length()) {
                            if (!force && !active(g)) return
                            val p = pts.getJSONArray(i)
                            acc.tap((p.getDouble(0) * w / 100.0).toInt(), (p.getDouble(1) * h / 100.0).toInt())
                            Thread.sleep(delay)
                        }
                    }
                }

                override fun onDestroy() {
                    running = false
                    holding = false
                    gen++
                    try { loopThread?.join(1500) } catch (e: Exception) {}
                    try { boxOv?.let { wm?.removeView(it) } } catch (e: Exception) {}
                    try { vd?.release() } catch (e: Exception) {}
                    try { reader?.close() } catch (e: Exception) {}
                    try { projection?.stop() } catch (e: Exception) {}
                    try { recognizer?.close() } catch (e: Exception) {}
                    super.onDestroy()
                }
            }
