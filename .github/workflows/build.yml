name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
env:
  # >>> Changez le nom de l'appli ici (evitez les symboles | et &) :
  APP_NAME: "WildCraft Bot"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Creer le projet Android
        run: |
            mkdir -p app
            cat > app/build.gradle.kts <<'WCEOF'
            plugins {
                id("com.android.application")
                id("org.jetbrains.kotlin.android")
            }
            android {
                namespace = "com.example.wcbot"
                compileSdk = 34
                defaultConfig {
                    applicationId = "com.example.wcbot"
                    minSdk = 26
                    targetSdk = 34
                    versionCode = 1
                    versionName = "1.0"
                }
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
                kotlinOptions { jvmTarget = "17" }
            }
            dependencies {
                implementation("org.opencv:opencv:4.9.0")
            }
            WCEOF
            mkdir -p app/src/main
            cat > app/src/main/AndroidManifest.xml <<'WCEOF'
