            package com.example.wcbot

            import android.app.Activity
            import android.content.Intent
            import android.graphics.Typeface
            import android.graphics.drawable.GradientDrawable
            import android.media.projection.MediaProjectionManager
            import android.net.Uri
            import android.os.Bundle
            import android.provider.Settings
            import android.util.DisplayMetrics
            import android.view.Gravity
            import android.view.ViewGroup
            import android.widget.Button
            import android.widget.EditText
            import android.widget.LinearLayout
            import android.widget.ScrollView
            import android.widget.TextView
            import android.widget.Toast
            import java.io.File

            class MainActivity : Activity() {
                private val GREEN = 0xFF00FF41.toInt()
                private val DIM = 0xFF00B34A.toInt()
                private val SOFT = 0xFF9FE8B4.toInt()
                private val BG = 0xFF050A05.toInt()
                private val PANEL = 0xFF0D1A0D.toInt()

                private val fields = LinkedHashMap<String, EditText>()
                private val defaults = linkedMapOf(
                    "ocr" to 1, "hpBoss" to 10000, "radius" to 90, "fixed" to 1, "dir" to 0, "bossMiss" to 4, "atkBoss" to 0,
                    "tolColor" to 35, "thrNpc" to 75, "thrBoss" to 75
                )
                private val labels = mapOf(
                    "ocr" to "Méthode : 1 = lire le nombre de vie (recommandé), 0 = reconnaissance par images",
                    "hpBoss" to "Vie à partir de laquelle c'est un BOSS (ex : 10000)",
                    "radius" to "Amplitude du joystick (pixels)",
                    "fixed" to "Joystick en mode FIXE (1 = fixe, 0 = libre)",
                    "dir" to "Direction tenue autour du boss, en degrés (0=droite, 90=bas, 180=gauche, 270=haut)",
                    "bossMiss" to "Vérifications sans barre avant la fin du boss (1 = environ 0,3 s)",
                    "atkBoss" to "Taper sur le bouton d'attaque pendant le tour du boss (1 = oui, 0 = non)",
                    "tolColor" to "Boss : tolérance sur la couleur de la barre (plus grand = plus souple)",
                    "thrNpc" to "PNJ : sensibilité de détection (%)",
                    "thrBoss" to "Boss : part de la longueur de votre image de barre à retrouver (%)"
                )
                private val PICK_NPC = 1
                private val PICK_BOSS = 2
                private val REQ_CAPTURE = 3
                private var status: TextView? = null

                private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

                private fun styled(b: Button) {
                    val d = GradientDrawable()
                    d.setColor(PANEL)
                    d.setStroke(dp(1) + 1, GREEN)
                    d.cornerRadius = dp(6).toFloat()
                    b.background = d
                    b.setTextColor(GREEN)
                    b.typeface = Typeface.MONOSPACE
                    b.setAllCaps(false)
                    b.textSize = 14f
                    b.gravity = Gravity.START or Gravity.CENTER_VERTICAL
                    b.setPadding(dp(14), dp(10), dp(14), dp(10))
                }

                override fun onCreate(savedInstanceState: Bundle?) {
                    super.onCreate(savedInstanceState)
                    window.statusBarColor = BG
                    window.navigationBarColor = BG
                    val prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                    val sv = ScrollView(this)
                    sv.setBackgroundColor(BG)
                    val box = LinearLayout(this)
                    box.orientation = LinearLayout.VERTICAL
                    box.setPadding(dp(18), dp(18), dp(18), dp(30))
                    sv.addView(box)

                    fun lp(top: Int): LinearLayout.LayoutParams {
                        val l = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                        l.topMargin = dp(top)
                        return l
                    }

                    fun text(t: String, color: Int, size: Float, top: Int): TextView {
                        val tv = TextView(this)
                        tv.text = t
                        tv.setTextColor(color)
                        tv.typeface = Typeface.MONOSPACE
                        tv.textSize = size
                        box.addView(tv, lp(top))
                        return tv
                    }

                    fun header(t: String) { text("// " + t, DIM, 13f, 24) }

                    fun button(t: String, action: () -> Unit) {
                        val b = Button(this)
                        b.text = t
                        styled(b)
                        b.setOnClickListener { action() }
                        box.addView(b, lp(8))
                    }

                    text("> " + getString(R.string.app_name).uppercase() + "_", GREEN, 24f, 0)
                    val st = text("", GREEN, 13f, 12)
                    st.setBackgroundColor(PANEL)
                    st.setPadding(dp(12), dp(10), dp(12), dp(10))
                    status = st

                    header("01  AUTORISATIONS")
                    button("1a. Autoriser l'affichage par-dessus les applis") {
                        startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                    }
                    button("1b. Activer le service d'accessibilité") {
                        startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                    }

                    header("02  CIBLES PAR IMAGES  (inutile si Méthode = 1)")
                    text(
                        "PNJ : choisissez des images rognées du PNJ (son nom ou une icône).\n" +
                            "BOSS : on ne cherche pas le boss lui-même, mais SA BARRE DE VIE. Rognez dans une capture un petit " +
                            "rectangle de la partie COLORÉE de la barre (sans bord ni fond), puis choisissez-le ici.\n" +
                            "Si la barre change de couleur avec la vie, ajoutez une image par couleur.",
                        SOFT, 12f, 6
                    )
                    button("2a. PNJ  : ajouter des images") { pick(PICK_NPC) }
                    button("2b. BOSS : ajouter des images de barre de vie") { pick(PICK_BOSS) }
                    button("Effacer les images de PNJ") { clear("npc_") }
                    button("Effacer les images de boss") { clear("boss_") }

                    header("03  POSITIONS")
                    button("3a. Placer le joystick et le bouton d'attaque") { calibrate("buttons") }
                    button("3b. Placer la zone du nombre de vie (ciblez un monstre avant)") { calibrate("zone") }
                    button("Test des gestes (dans 8 s : appui attaque, puis joystick tenu 3 s)") { testGestures() }

                    header("04  REGLAGES")
                    for ((k, d) in defaults) {
                        text(labels[k] ?: k, DIM, 12f, 12)
                        val et = EditText(this)
                        et.setText(prefs.getInt(k, d).toString())
                        et.inputType = android.text.InputType.TYPE_CLASS_NUMBER
                        et.setTextColor(GREEN)
                        et.typeface = Typeface.MONOSPACE
                        et.setBackgroundColor(PANEL)
                        et.setPadding(dp(12), dp(8), dp(12), dp(8))
                        box.addView(et, lp(4))
                        fields[k] = et
                    }

                    header("05  LANCEMENT")
                    button("4. DEMARRER  (puis ouvrez WildCraft)") { start() }
                    button("[ QUITTER LE BOT ]") { quitBot() }
                    text("Astuce : un appui long sur le bouton flottant quitte aussi le bot.", SOFT, 12f, 10)
                    setContentView(sv)
                }

                override fun onResume() {
                    super.onResume()
                    refreshStatus()
                }

                private fun count(prefix: String): Int =
                    (filesDir.listFiles() ?: emptyArray()).count { it.name.startsWith(prefix) }

                private fun refreshStatus() {
                    val cfg = getSharedPreferences("cfg", MODE_PRIVATE)
                    val ok = cfg.contains("joyFX") && cfg.contains("btnFX")
                    status?.text = "[positions]  " + (if (ok) "OK" else "a placer") +
                        "\n[zone de vie]  " + (if (cfg.contains("hp1FX") && cfg.contains("hp2FX")) "OK" else "a placer") +
                        "\n[images PNJ]  " + count("npc_") + "\n[images BOSS] " + count("boss_") +
                        "\n[accessibilite] " + (if (BotAccessibility.instance != null) "ON" else "OFF")
                }

                private fun clear(prefix: String) {
                    (filesDir.listFiles() ?: emptyArray()).filter { it.name.startsWith(prefix) }.forEach { it.delete() }
                    refreshStatus()
                }

                private fun quitBot() {
                    val s = Intent(this, BotService::class.java)
                    s.action = "STOP"
                    startService(s)
                    Toast.makeText(this, "Bot arrêté", Toast.LENGTH_SHORT).show()
                }

                private fun pick(code: Int) {
                    val i = Intent(Intent.ACTION_GET_CONTENT)
                    i.type = "image/*"
                    i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                    startActivityForResult(i, code)
                }

                private fun calibrate(mode: String) {
                    if (!Settings.canDrawOverlays(this)) {
                        Toast.makeText(this, "Autorisez d'abord l'affichage par-dessus les applis (1a)", Toast.LENGTH_LONG).show()
                        return
                    }
                    val cs = Intent(this, CalibService::class.java)
                    cs.putExtra("mode", mode)
                    startService(cs)
                    Toast.makeText(this, "Ouvrez WildCraft : le réglage démarre dans 12 secondes", Toast.LENGTH_LONG).show()
                    moveTaskToBack(true)
                }

                @Suppress("DEPRECATION")
                private fun testGestures() {
                    val cfg = getSharedPreferences("cfg", MODE_PRIVATE)
                    val acc = BotAccessibility.instance
                    if (acc == null) {
                        Toast.makeText(this, "Activez d'abord le service d'accessibilité (1b)", Toast.LENGTH_LONG).show()
                        return
                    }
                    if (!cfg.contains("joyFX") || !cfg.contains("btnFX")) {
                        Toast.makeText(this, "Placez d'abord le joystick et le bouton d'attaque (3a)", Toast.LENGTH_LONG).show()
                        return
                    }
                    save()
                    val dm = DisplayMetrics()
                    windowManager.defaultDisplay.getRealMetrics(dm)
                    val jx = (cfg.getFloat("joyFX", 15f) * dm.widthPixels / 100f).toInt()
                    val jy = (cfg.getFloat("joyFY", 70f) * dm.heightPixels / 100f).toInt()
                    val bx = (cfg.getFloat("btnFX", 90f) * dm.widthPixels / 100f).toInt()
                    val by = (cfg.getFloat("btnFY", 70f) * dm.heightPixels / 100f).toInt()
                    val r = cfg.getInt("radius", 90)
                    val rad = Math.toRadians(cfg.getInt("dir", 0).toDouble())
                    val tx = jx + (r * Math.cos(rad)).toInt()
                    val ty = jy + (r * Math.sin(rad)).toInt()
                    Toast.makeText(this, "Ouvrez WildCraft : test dans 8 secondes", Toast.LENGTH_LONG).show()
                    moveTaskToBack(true)
                    Thread {
                        try {
                            Thread.sleep(8000)
                            acc.tap(bx, by)
                            Thread.sleep(1500)
                            val end = System.currentTimeMillis() + 3000
                            acc.holdDirection(jx, jy, tx, ty, bx, by, false) { System.currentTimeMillis() < end }
                        } catch (e: Exception) {}
                    }.start()
                }

                private fun save() {
                    val e = getSharedPreferences("cfg", MODE_PRIVATE).edit()
                    for ((k, et) in fields) e.putInt(k, et.text.toString().toIntOrNull() ?: defaults[k]!!)
                    e.apply()
                }

                private fun start() {
                    val cfg = getSharedPreferences("cfg", MODE_PRIVATE)
                    if (!Settings.canDrawOverlays(this)) {
                        Toast.makeText(this, "Autorisez d'abord l'affichage par-dessus les applis (1a)", Toast.LENGTH_LONG).show()
                        return
                    }
                    if (BotAccessibility.instance == null) {
                        Toast.makeText(this, "Activez d'abord le service d'accessibilité (1b)", Toast.LENGTH_LONG).show()
                        return
                    }
                    if (!cfg.contains("joyFX") || !cfg.contains("btnFX")) {
                        Toast.makeText(this, "Placez d'abord le joystick et le bouton d'attaque (3a)", Toast.LENGTH_LONG).show()
                        return
                    }
                    val ocr = (fields["ocr"]?.text?.toString()?.toIntOrNull() ?: 1) == 1
                    if (ocr) {
                        if (!cfg.contains("hp1FX") || !cfg.contains("hp2FX")) {
                            Toast.makeText(this, "Placez d'abord la zone du nombre de vie (3b)", Toast.LENGTH_LONG).show()
                            return
                        }
                    } else if (count("npc_") + count("boss_") == 0) {
                        Toast.makeText(this, "Ajoutez au moins une image (2a ou 2b)", Toast.LENGTH_LONG).show()
                        return
                    }
                    save()
                    val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                    startActivityForResult(mpm.createScreenCaptureIntent(), REQ_CAPTURE)
                }

                override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                    super.onActivityResult(requestCode, resultCode, data)
                    if (resultCode != RESULT_OK || data == null) return
                    if (requestCode == PICK_NPC || requestCode == PICK_BOSS) {
                        val uris = ArrayList<Uri>()
                        val clip = data.clipData
                        if (clip != null) {
                            for (i in 0 until clip.itemCount) uris.add(clip.getItemAt(i).uri)
                        } else {
                            data.data?.let { uris.add(it) }
                        }
                        val prefix = if (requestCode == PICK_NPC) "npc_" else "boss_"
                        var n = 0
                        for (u in uris) {
                            contentResolver.openInputStream(u)?.use { input ->
                                File(filesDir, prefix + System.currentTimeMillis() + "_" + n + ".img")
                                    .outputStream().use { input.copyTo(it) }
                            }
                            n++
                        }
                        Toast.makeText(this, n.toString() + " image(s) ajoutée(s)", Toast.LENGTH_SHORT).show()
                        refreshStatus()
                    } else if (requestCode == REQ_CAPTURE) {
                        val s = Intent(this, BotService::class.java)
                        s.putExtra("code", resultCode)
                        s.putExtra("data", data)
                        startForegroundService(s)
                        Toast.makeText(this, "Ouvrez WildCraft et utilisez le bouton flottant ▶", Toast.LENGTH_LONG).show()
                    }
                }
            }
