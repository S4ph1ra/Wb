                    save()
                    val dm = DisplayMetrics()
                    windowManager.defaultDisplay.getRealMetrics(dm)
                    val jx = (cfg.getFloat("joyFX", 15f) * dm.widthPixels / 100f).toInt()
                    val jy = (cfg.getFloat("joyFY", 70f) * dm.heightPixels / 100f).toInt()
                    val bx = (cfg.getFloat("btnFX", 90f) * dm.widthPixels / 100f).toInt()
                    val by = (cfg.getFloat("btnFY", 70f) * dm.heightPixels / 100f).toInt()
                    val r = cfg.getInt("radius", 90)
                    val rad = Math.toRadians(cfg.getInt("dir", 0).toDouble())
                    val tx = jx + (r * Math.cos(rad)).toInt()
                    val ty = jy + (r * Math.sin(rad)).toInt()
                    Toast.makeText(this, "Ouvrez WildCraft : test dans 8 secondes", Toast.LENGTH_LONG).show()
                    moveTaskToBack(true)
                    Thread {
                        try {
                            Thread.sleep(8000)
                            acc.tap(bx, by)
                            Thread.sleep(1500)
                            val end = System.currentTimeMillis() + 3000
                            acc.holdDirection(jx, jy, tx, ty, bx, by, false) { System.currentTimeMillis() < end }
                        } catch (e: Exception) {}
                    }.start()
                }

                private fun save() {
                    val e = getSharedPreferences("cfg", MODE_PRIVATE).edit()
                    for ((k, et) in fields) e.putInt(k, et.text.toString().toIntOrNull() ?: defaults[k]!!)
                    e.apply()
                }

                private fun start() {
                    val cfg = getSharedPreferences("cfg", MODE_PRIVATE)
                    if (!Settings.canDrawOverlays(this)) {
                        Toast.makeText(this, "Autorisez d'abord l'affichage par-dessus les applis (1a)", Toast.LENGTH_LONG).show()
                        return
                    }
                    if (BotAccessibility.instance == null) {
                        Toast.makeText(this, "Activez d'abord le service d'accessibilité (1b)", Toast.LENGTH_LONG).show()
                        return
                    }
                    if (!cfg.contains("joyFX") || !cfg.contains("btnFX")) {
                        Toast.makeText(this, "Placez d'abord le joystick et le bouton d'attaque (3a)", Toast.LENGTH_LONG).show()
                        return
                    }
                    val ocr = (fields["ocr"]?.text?.toString()?.toIntOrNull() ?: 1) == 1
                    if (ocr) {
                        if (!cfg.contains("hp1FX") || !cfg.contains("hp2FX")) {
                            Toast.makeText(this, "Placez d'abord la zone du nombre de vie (3b)", Toast.LENGTH_LONG).show()
                            return
                        }
                    } else if (count("npc_") + count("boss_") == 0) {
                        Toast.makeText(this, "Ajoutez au moins une image (2a ou 2b)", Toast.LENGTH_LONG).show()
                        return
                    }
                    save()
                    val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                    startActivityForResult(mpm.createScreenCaptureIntent(), REQ_CAPTURE)
                }

                override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                    super.onActivityResult(requestCode, resultCode, data)
                    if (resultCode != RESULT_OK || data == null) return
                    if (requestCode == PICK_NPC || requestCode == PICK_BOSS) {
                        val uris = ArrayList<Uri>()
                        val clip = data.clipData
                        if (clip != null) {
                            for (i in 0 until clip.itemCount) uris.add(clip.getItemAt(i).uri)
                        } else {
                            data.data?.let { uris.add(it) }
                        }
                        val prefix = if (requestCode == PICK_NPC) "npc_" else "boss_"
                        var n = 0
                        for (u in uris) {
                            contentResolver.openInputStream(u)?.use { input ->
                                File(filesDir, prefix + System.currentTimeMillis() + "_" + n + ".img")
                                    .outputStream().use { input.copyTo(it) }
                            }
                            n++
                        }
                        Toast.makeText(this, n.toString() + " image(s) ajoutée(s)", Toast.LENGTH_SHORT).show()
                        refreshStatus()
                    } else if (requestCode == REQ_CAPTURE) {
                        val s = Intent(this, BotService::class.java)
                        s.putExtra("code", resultCode)
                        s.putExtra("data", data)
                        startForegroundService(s)
                        Toast.makeText(this, "Ouvrez WildCraft et utilisez le bouton flottant ▶", Toast.LENGTH_LONG).show()
                    }
                }
            }
            WCEOF
            mkdir -p app/src/main/res/values
            cat > app/src/main/res/values/strings.xml <<'WCEOF'
            <?xml version="1.0" encoding="utf-8"?>
            <resources>
                <string name="app_name">WildCraft Bot</string>
                <string name="acc_desc">Permet au bot d\'appuyer sur l\'écran et de bouger le joystick.</string>
            </resources>
            WCEOF
            mkdir -p app/src/main/res/xml
            cat > app/src/main/res/xml/accessibility_config.xml <<'WCEOF'
            <?xml version="1.0" encoding="utf-8"?>
            <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
                android:accessibilityEventTypes="typeAllMask"
                android:accessibilityFeedbackType="feedbackGeneric"
                android:canPerformGestures="true"
                android:description="@string/acc_desc"
                android:notificationTimeout="100" />
            WCEOF
            cat > build.gradle.kts <<'WCEOF'
            plugins {
                id("com.android.application") version "8.5.2" apply false
                id("org.jetbrains.kotlin.android") version "1.9.24" apply false
            }
            WCEOF
            cat > gradle.properties <<'WCEOF'
            org.gradle.jvmargs=-Xmx2g
            android.useAndroidX=true
            WCEOF
            cat > settings.gradle.kts <<'WCEOF'
            pluginManagement {
                repositories { google(); mavenCentral(); gradlePluginPortal() }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories { google(); mavenCentral() }
            }
            rootProject.name = "WildcraftBot"
            include(":app")
            WCEOF
      - name: Personnaliser nom et icone
        run: |
          sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">${APP_NAME}</string>|" app/src/main/res/values/strings.xml
          if [ -f icon.png ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            sed -i 's|<application|<application android:icon="@mipmap/ic_launcher"|' app/src/main/AndroidManifest.xml
            echo "Icone personnalisee ajoutee"
          fi
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Compiler
        run: gradle assembleDebug --no-daemon
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ${{ env.APP_NAME }} ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
