                private fun refreshStatus() {
                    val cfg = getSharedPreferences("cfg", MODE_PRIVATE)
                    val pos = cfg.contains("joyFX") && cfg.contains("btnFX")
                    val zone = cfg.contains("hp1FX") && cfg.contains("hp2FX")
                    val acc = BotAccessibility.instance != null
                    val sb = SpannableStringBuilder()
                    statusLine(sb, pos, "positions", if (pos) "OK" else "à placer (3a)")
                    statusLine(sb, zone, "zone de vie", if (zone) "OK" else "à placer (3b)")
                    statusLine(sb, acc, "accessibilité", if (acc) "ON" else "OFF (1b)")
                    statusLine(sb, true, "images PNJ / BOSS", count("npc_").toString() + " / " + count("boss_").toString())
