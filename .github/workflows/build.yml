                private fun calibrate(mode: String) {
                    if (!Settings.canDrawOverlays(this)) {
                        Toast.makeText(this, "Autorisez d'abord l'affichage par-dessus les applis (1a)", Toast.LENGTH_LONG).show()
                        return
                    }
                    val cs = Intent(this, CalibService::class.java)
                    cs.putExtra("mode", mode)
                    startService(cs)
                    Toast.makeText(this, "Ouvrez WildCraft : le réglage démarre dans 12 secondes", Toast.LENGTH_LONG).show()
                    moveTaskToBack(true)
                }

                @Suppress("DEPRECATION")
