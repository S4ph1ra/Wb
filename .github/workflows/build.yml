            package com.example.wcbot

            import android.app.Service
            import android.content.Intent
            import android.graphics.PixelFormat
            import android.os.Build
            import android.os.Handler
            import android.os.IBinder
            import android.os.Looper
            import android.util.DisplayMetrics
            import android.view.Gravity
            import android.view.MotionEvent
            import android.view.ViewGroup
            import android.view.WindowManager
            import android.widget.Button
            import android.widget.FrameLayout
            import android.widget.TextView
            import android.widget.Toast

            /** Affiche un voile par-dessus le jeu : on touche le joystick puis le bouton d'attaque, c'est enregistré. */
            class CalibService : Service() {
                private var wm: WindowManager? = null
                private var root: FrameLayout? = null
                private val handler = Handler(Looper.getMainLooper())
                private val steps = listOf("Touchez le CENTRE du joystick de déplacement", "Touchez le bouton d'ATTAQUE")
                private val keys = listOf("joy", "btn")
                private var step = 0

                override fun onBind(intent: Intent?): IBinder? = null

                override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                    handler.postDelayed({ show() }, 12000)
                    return START_NOT_STICKY
                }

                @Suppress("DEPRECATION")
                private fun show() {
                    val manager = getSystemService(WINDOW_SERVICE) as WindowManager
                    wm = manager
                    val dm = DisplayMetrics()
                    manager.defaultDisplay.getRealMetrics(dm)
                    val sw = dm.widthPixels.toFloat()
                    val sh = dm.heightPixels.toFloat()

                    val frame = FrameLayout(this)
                    frame.setBackgroundColor(0x99000000.toInt())

                    val label = TextView(this)
                    label.text = steps[0]
                    label.textSize = 24f
                    label.setTextColor(0xFFFFFFFF.toInt())
                    label.gravity = Gravity.CENTER
                    val lpLabel = FrameLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP
                    )
                    lpLabel.topMargin = 40
                    frame.addView(label, lpLabel)

                    val cancel = Button(this)
                    cancel.text = "Annuler"
                    cancel.setOnClickListener { stopSelf() }
                    frame.addView(
                        cancel,
                        FrameLayout.LayoutParams(
                            ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                            Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                        )
                    )

                    frame.setOnTouchListener { _, ev ->
                        if (ev.action == MotionEvent.ACTION_DOWN) {
                            val e = getSharedPreferences("cfg", MODE_PRIVATE).edit()
                            e.putFloat(keys[step] + "FX", ev.rawX / sw * 100f)
                            e.putFloat(keys[step] + "FY", ev.rawY / sh * 100f)
                            e.apply()
                            step++
                            if (step >= steps.size) {
                                Toast.makeText(this, "Positions enregistrées ✔", Toast.LENGTH_LONG).show()
                                stopSelf()
                            } else {
                                label.text = steps[step]
                            }
                        }
                        true
                    }

                    val lp = WindowManager.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT,
                        WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                        WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                            WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                        PixelFormat.TRANSLUCENT
                    )
                    if (Build.VERSION.SDK_INT >= 28) {
                        lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                    }
                    manager.addView(frame, lp)
                    root = frame
                }

                override fun onDestroy() {
                    handler.removeCallbacksAndMessages(null)
                    try { root?.let { wm?.removeView(it) } } catch (e: Exception) {}
                    super.onDestroy()
                }
            }
