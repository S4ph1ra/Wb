            package com.example.wcbot

            import android.app.Activity
            import android.content.Intent
            import android.media.projection.MediaProjectionManager
            import android.net.Uri
            import android.os.Bundle
            import android.provider.Settings
            import android.widget.Button
            import android.widget.EditText
            import android.widget.LinearLayout
            import android.widget.ScrollView
            import android.widget.TextView
            import android.widget.Toast
            import java.io.File

            class MainActivity : Activity() {
                private val fields = LinkedHashMap<String, EditText>()
                private val defaults = linkedMapOf(
                    "radius" to 90, "fixed" to 1, "dir" to 0, "bossMiss" to 4, "atkBoss" to 0,
                    "thrNpc" to 75, "thrBoss" to 75
                )
                private val labels = mapOf(
                    "radius" to "Amplitude du joystick (pixels)",
                    "fixed" to "Joystick en mode FIXE (1 = fixe, 0 = libre)",
                    "dir" to "Direction tenue autour du boss en degrés (0=droite, 90=bas, 180=gauche, 270=haut)",
                    "bossMiss" to "Vérifications sans barre avant la fin du boss (1 = environ 0,3 s)",
                    "atkBoss" to "Taper sur le bouton d'attaque pendant le tour du boss (1 = oui, 0 = non)",
                    "thrNpc" to "Sensibilité détection PNJ (%)",
                    "thrBoss" to "Sensibilité détection boss (%)"
                )
                private val PICK_NPC = 1
                private val PICK_BOSS = 2
                private val REQ_CAPTURE = 3
                private var status: TextView? = null

                override fun onCreate(savedInstanceState: Bundle?) {
                    super.onCreate(savedInstanceState)
                    val prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                    val sv = ScrollView(this)
                    val box = LinearLayout(this)
                    box.orientation = LinearLayout.VERTICAL
                    box.setPadding(40, 40, 40, 40)
                    sv.addView(box)

                    fun button(t: String, action: () -> Unit) {
                        val b = Button(this)
                        b.text = t
                        b.setOnClickListener { action() }
                        box.addView(b)
                    }

                    val title = TextView(this)
                    title.text = getString(R.string.app_name)
                    title.textSize = 22f
                    box.addView(title)
                    val st = TextView(this)
                    box.addView(st)
                    status = st

                    button("1a. Autoriser l'affichage par-dessus les applis") {
                        startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                    }
                    button("1b. Activer le service d'accessibilité") {
                        startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                    }
                    button("2a. Ajouter des images de PNJ (plusieurs possibles)") { pick(PICK_NPC) }
                    button("2b. Ajouter des images de barre de vie de boss (plusieurs possibles)") { pick(PICK_BOSS) }
                    button("Effacer les images de PNJ") { clear("npc_") }
                    button("Effacer les images de boss") { clear("boss_") }
                    button("3. Placer le joystick et le bouton d'attaque") { calibrate() }

                    for ((k, d) in defaults) {
                        val tv = TextView(this)
                        tv.text = labels[k]
                        box.addView(tv)
                        val et = EditText(this)
                        et.setText(prefs.getInt(k, d).toString())
                        et.inputType = android.text.InputType.TYPE_CLASS_NUMBER
                        box.addView(et)
                        fields[k] = et
                    }

                    button("4. DÉMARRER (puis ouvrez WildCraft)") { start() }
                    button("Quitter le bot (retire le bouton flottant)") {
                        stopService(Intent(this, BotService::class.java))
                    }
                    setContentView(sv)
                }

                override fun onResume() {
                    super.onResume()
                    refreshStatus()
                }

                private fun count(prefix: String): Int =
                    (filesDir.listFiles() ?: emptyArray()).count { it.name.startsWith(prefix) }

                private fun refreshStatus() {
                    val cfg = getSharedPreferences("cfg", MODE_PRIVATE)
                    val ok = cfg.contains("joyFX") && cfg.contains("btnFX")
                    status?.text = "Positions : " + (if (ok) "enregistrées ✔" else "pas encore placées") +
                        "\nImages PNJ : " + count("npc_") + "   |   Images boss : " + count("boss_")
                }

                private fun clear(prefix: String) {
                    (filesDir.listFiles() ?: emptyArray()).filter { it.name.startsWith(prefix) }.forEach { it.delete() }
                    refreshStatus()
                }

                private fun pick(code: Int) {
                    val i = Intent(Intent.ACTION_GET_CONTENT)
                    i.type = "image/*"
                    i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                    startActivityForResult(i, code)
                }

                private fun calibrate() {
                    if (!Settings.canDrawOverlays(this)) {
                        Toast.makeText(this, "Autorisez d'abord l'affichage par-dessus les applis (1a)", Toast.LENGTH_LONG).show()
                        return
                    }
                    startService(Intent(this, CalibService::class.java))
                    Toast.makeText(this, "Ouvrez WildCraft : le réglage démarre dans 12 secondes", Toast.LENGTH_LONG).show()
                    moveTaskToBack(true)
                }

                private fun save() {
                    val e = getSharedPreferences("cfg", MODE_PRIVATE).edit()
                    for ((k, et) in fields) e.putInt(k, et.text.toString().toIntOrNull() ?: defaults[k]!!)
                    e.apply()
                }

                private fun start() {
                    val cfg = getSharedPreferences("cfg", MODE_PRIVATE)
                    if (!Settings.canDrawOverlays(this)) {
                        Toast.makeText(this, "Autorisez d'abord l'affichage par-dessus les applis (1a)", Toast.LENGTH_LONG).show()
                        return
                    }
                    if (BotAccessibility.instance == null) {
                        Toast.makeText(this, "Activez d'abord le service d'accessibilité (1b)", Toast.LENGTH_LONG).show()
                        return
                    }
                    if (!cfg.contains("joyFX") || !cfg.contains("btnFX")) {
                        Toast.makeText(this, "Placez d'abord le joystick et le bouton d'attaque (3)", Toast.LENGTH_LONG).show()
                        return
                    }
                    if (count("npc_") + count("boss_") == 0) {
                        Toast.makeText(this, "Ajoutez au moins une image (2a ou 2b)", Toast.LENGTH_LONG).show()
                        return
                    }
                    save()
                    val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                    startActivityForResult(mpm.createScreenCaptureIntent(), REQ_CAPTURE)
                }

                override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                    super.onActivityResult(requestCode, resultCode, data)
                    if (resultCode != RESULT_OK || data == null) return
                    if (requestCode == PICK_NPC || requestCode == PICK_BOSS) {
                        val uris = ArrayList<Uri>()
                        val clip = data.clipData
                        if (clip != null) {
                            for (i in 0 until clip.itemCount) uris.add(clip.getItemAt(i).uri)
                        } else {
                            data.data?.let { uris.add(it) }
                        }
                        val prefix = if (requestCode == PICK_NPC) "npc_" else "boss_"
                        var n = 0
                        for (u in uris) {
                            contentResolver.openInputStream(u)?.use { input ->
                                File(filesDir, prefix + System.currentTimeMillis() + "_" + n + ".img")
                                    .outputStream().use { input.copyTo(it) }
                            }
                            n++
                        }
                        Toast.makeText(this, n.toString() + " image(s) ajoutée(s)", Toast.LENGTH_SHORT).show()
                        refreshStatus()
                    } else if (requestCode == REQ_CAPTURE) {
                        val s = Intent(this, BotService::class.java)
                        s.putExtra("code", resultCode)
                        s.putExtra("data", data)
                        startForegroundService(s)
                        Toast.makeText(this, "Ouvrez WildCraft et utilisez le bouton flottant ▶", Toast.LENGTH_LONG).show()
                    }
                }
            }
            WCEOF
            mkdir -p app/src/main/res/values
            cat > app/src/main/res/values/strings.xml <<'WCEOF'
            <?xml version="1.0" encoding="utf-8"?>
            <resources>
                <string name="app_name">WildCraft Bot</string>
                <string name="acc_desc">Permet au bot d\'appuyer sur l\'écran et de bouger le joystick.</string>
            </resources>
            WCEOF
            mkdir -p app/src/main/res/xml
            cat > app/src/main/res/xml/accessibility_config.xml <<'WCEOF'
            <?xml version="1.0" encoding="utf-8"?>
            <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
                android:accessibilityEventTypes="typeAllMask"
                android:accessibilityFeedbackType="feedbackGeneric"
                android:canPerformGestures="true"
                android:description="@string/acc_desc"
                android:notificationTimeout="100" />
            WCEOF
            cat > build.gradle.kts <<'WCEOF'
            plugins {
                id("com.android.application") version "8.5.2" apply false
                id("org.jetbrains.kotlin.android") version "1.9.24" apply false
            }
            WCEOF
            cat > gradle.properties <<'WCEOF'
            org.gradle.jvmargs=-Xmx2g
            android.useAndroidX=true
            WCEOF
            cat > settings.gradle.kts <<'WCEOF'
            pluginManagement {
                repositories { google(); mavenCentral(); gradlePluginPortal() }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories { google(); mavenCentral() }
            }
            rootProject.name = "WildcraftBot"
            include(":app")
            WCEOF
      - name: Personnaliser nom et icone
        run: |
          sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">${APP_NAME}</string>|" app/src/main/res/values/strings.xml
          if [ -f icon.png ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            sed -i 's|<application|<application android:icon="@mipmap/ic_launcher"|' app/src/main/AndroidManifest.xml
            echo "Icone personnalisee ajoutee"
          fi
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Compiler
        run: gradle assembleDebug --no-daemon
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ${{ env.APP_NAME }} ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
