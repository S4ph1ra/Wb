            mkdir -p app/src/main/java/com/example/wcbot
            cat > app/src/main/java/com/example/wcbot/MainActivity.kt <<'WCEOF'
            package com.example.wcbot

            import android.app.Activity
            import android.app.AlertDialog
            import android.content.Intent
            import android.content.res.ColorStateList
            import android.graphics.Typeface
            import android.graphics.drawable.GradientDrawable
            import android.graphics.drawable.StateListDrawable
            import android.media.projection.MediaProjectionManager
            import android.net.Uri
            import android.os.Bundle
            import android.os.Handler
            import android.os.Looper
            import android.provider.Settings
            import android.text.Editable
            import android.text.InputType
            import android.text.SpannableStringBuilder
            import android.text.Spanned
            import android.text.TextWatcher
            import android.text.style.ForegroundColorSpan
            import android.util.DisplayMetrics
            import android.view.Gravity
            import android.view.ViewGroup
            import android.widget.Button
            import android.widget.EditText
            import android.widget.FrameLayout
            import android.widget.LinearLayout
            import android.widget.ScrollView
            import android.widget.SeekBar
            import android.widget.Switch
            import android.widget.TextView
            import android.widget.Toast
            import org.json.JSONArray

            class MainActivity : Activity() {
                private val GREEN = 0xFF00FF41.toInt()
                private val DIM = 0xFF00B34A.toInt()
                private val CYAN = 0xFF19D3FF.toInt()
                private val AMBER = 0xFFFFB000.toInt()
                private val RED = 0xFFFF4D4D.toInt()
                private val SOFT = 0xFF9FE8B4.toInt()
                private val FAINT = 0xFF4E7A5B.toInt()
                private val BG = 0xFF050A05.toInt()
                private val PANEL = 0xFF0D1A0D.toInt()
                private val CARD = 0xFF081008.toInt()
                private val REQ_CAPTURE = 3

                private var tab = 0
                private var content: FrameLayout? = null
                private var tabBar: LinearLayout? = null
                private var status: TextView? = null
                private val handler = Handler(Looper.getMainLooper())

                private fun cfg() = Store.cfg(this)
                private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
                private fun toast(k: String) { Toast.makeText(this, L.t(k), Toast.LENGTH_LONG).show() }

                // ---------------------------------------------------------------- style
                private fun outline(stroke: Int, fill: Int, radius: Int): GradientDrawable {
                    val d = GradientDrawable()
                    d.setColor(fill)
                    d.setStroke(dp(1) + 1, stroke)
                    d.cornerRadius = dp(radius).toFloat()
                    return d
                }

                private fun styled(b: Button, color: Int) {
                    val sl = StateListDrawable()
                    sl.addState(intArrayOf(android.R.attr.state_pressed), outline(color, color, 6))
                    sl.addState(intArrayOf(), outline(color, PANEL, 6))
                    b.background = sl
                    b.setTextColor(ColorStateList(arrayOf(intArrayOf(android.R.attr.state_pressed), intArrayOf()), intArrayOf(BG, color)))
                    b.typeface = Typeface.MONOSPACE
                    b.setAllCaps(false)
                    b.textSize = 14f
                    b.gravity = Gravity.START or Gravity.CENTER_VERTICAL
                    b.setPadding(dp(14), dp(10), dp(14), dp(10))
                }

                private fun styleSwitch(sw: Switch) {
                    val checked = intArrayOf(android.R.attr.state_checked)
                    sw.thumbTintList = ColorStateList(arrayOf(checked, intArrayOf()), intArrayOf(GREEN, 0xFF7A7A7A.toInt()))
                    sw.trackTintList = ColorStateList(arrayOf(checked, intArrayOf()), intArrayOf(0xFF0B5A25.toInt(), 0xFF2A2A2A.toInt()))
                }

                private fun lp(top: Int): LinearLayout.LayoutParams {
                    val l = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                    l.topMargin = dp(top)
                    return l
                }

                private fun newPage(): Pair<ScrollView, LinearLayout> {
                    val sv = ScrollView(this)
                    sv.setBackgroundColor(BG)
                    sv.isVerticalScrollBarEnabled = false
                    val box = LinearLayout(this)
                    box.orientation = LinearLayout.VERTICAL
                    box.setPadding(dp(18), dp(18), dp(18), dp(24))
                    sv.addView(box)
                    return Pair(sv, box)
                }

                private fun text(parent: LinearLayout, t: String, color: Int, size: Float, top: Int): TextView {
                    val tv = TextView(this)
                    tv.text = t
                    tv.setTextColor(color)
                    tv.typeface = Typeface.MONOSPACE
                    tv.textSize = size
                    parent.addView(tv, lp(top))
                    return tv
                }

                /** Carte avec un titre technique et un commentaire en gris. */
                private fun section(box: LinearLayout, title: String, hint: String): LinearLayout {
                    text(box, "── " + title + " ──", CYAN, 13f, 22)
                    if (hint.isNotEmpty()) text(box, hint, FAINT, 11f, 2)
                    val card = LinearLayout(this)
                    card.orientation = LinearLayout.VERTICAL
                    card.background = outline(DIM, CARD, 8)
                    card.setPadding(dp(12), dp(6), dp(12), dp(14))
                    box.addView(card, lp(8))
                    return card
                }

                private fun button(parent: LinearLayout, t: String, color: Int, action: () -> Unit): Button {
                    val b = Button(this)
                    b.text = "▸ " + t
                    styled(b, color)
                    b.setOnClickListener { action() }
                    parent.addView(b, lp(8))
                    return b
                }

                private fun switchRow(parent: LinearLayout, labelKey: String, key: String, def: Int) {
                    val row = LinearLayout(this)
                    row.orientation = LinearLayout.HORIZONTAL
                    row.gravity = Gravity.CENTER_VERTICAL
                    val tv = TextView(this)
                    tv.text = L.t(labelKey)
                    tv.setTextColor(SOFT)
                    tv.typeface = Typeface.MONOSPACE
                    tv.textSize = 13f
                    val sw = Switch(this)
                    styleSwitch(sw)
                    sw.isChecked = cfg().getInt(key, def) == 1
                    sw.setOnCheckedChangeListener { _, c -> cfg().edit().putInt(key, if (c) 1 else 0).apply() }
                    row.addView(tv, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                    row.addView(sw)
                    parent.addView(row, lp(12))
                }

                private fun numField(parent: LinearLayout, labelKey: String, key: String, def: Int) {
                    text(parent, L.t(labelKey), SOFT, 12f, 12)
                    val et = EditText(this)
                    et.setText(cfg().getInt(key, def).toString())
                    et.inputType = InputType.TYPE_CLASS_NUMBER
                    et.setTextColor(GREEN)
                    et.typeface = Typeface.MONOSPACE
                    et.background = outline(DIM, PANEL, 4)
                    et.setPadding(dp(12), dp(8), dp(12), dp(8))
                    et.addTextChangedListener(object : TextWatcher {
                        override fun afterTextChanged(s: Editable?) {
                            val v = s?.toString()?.toIntOrNull()
                            if (v != null) cfg().edit().putInt(key, v).apply()
                        }
                        override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                        override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {}
                    })
                    parent.addView(et, lp(4))
                }

                /** Boutons de choix (un seul actif), rangés par lignes de perRow. */
                private fun choices(parent: LinearLayout, labels: List<String>, current: Int, perRow: Int, onSel: (Int) -> Unit) {
                    var cur = current
                    val btns = ArrayList<Button>()
                    fun paint() {
                        for ((i, b) in btns.withIndex()) {
                            val sel = i == cur
                            b.background = outline(if (sel) GREEN else DIM, if (sel) 0xFF123A18.toInt() else PANEL, 6)
                            b.setTextColor(if (sel) GREEN else DIM)
                        }
                    }
                    var row: LinearLayout? = null
                    for ((i, t) in labels.withIndex()) {
                        if (i % perRow == 0) {
                            val r = LinearLayout(this)
                            r.orientation = LinearLayout.HORIZONTAL
                            parent.addView(r, lp(8))
                            row = r
                        }
                        val b = Button(this)
                        b.text = t
                        b.typeface = Typeface.MONOSPACE
                        b.setAllCaps(false)
                        b.textSize = 13f
                        b.minWidth = 0
                        b.setPadding(dp(6), dp(8), dp(6), dp(8))
                        b.setOnClickListener { cur = i; paint(); onSel(i) }
                        val l = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                        l.rightMargin = dp(6)
                        row?.addView(b, l)
                        btns.add(b)
                    }
                    paint()
                }

                private val compassLabels = listOf("→", "↘", "↓", "↙", "←", "↖", "↑", "↗")
                private val compassDegrees = listOf(0, 45, 90, 135, 180, 225, 270, 315)

                private fun compass(parent: LinearLayout, key: String, def: Int) {
                    choices(parent, compassLabels, maxOf(0, compassDegrees.indexOf(cfg().getInt(key, def))), 4) { i ->
                        cfg().edit().putInt(key, compassDegrees[i]).apply()
                    }
                }

                // ---------------------------------------------------------------- squelette + onglets
                override fun onCreate(savedInstanceState: Bundle?) {
                    super.onCreate(savedInstanceState)
                    L.init(this)
                    window.statusBarColor = BG
                    window.navigationBarColor = PANEL
                    val root = LinearLayout(this)
                    root.orientation = LinearLayout.VERTICAL
                    root.setBackgroundColor(BG)
                    val c = FrameLayout(this)
                    content = c
                    root.addView(c, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                    val bar = LinearLayout(this)
                    bar.orientation = LinearLayout.HORIZONTAL
                    bar.setBackgroundColor(PANEL)
                    bar.setPadding(dp(6), dp(6), dp(6), dp(6))
                    tabBar = bar
                    root.addView(bar, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                    setContentView(root)
                    showTab(0)
                }

                override fun onResume() {
                    super.onResume()
                    if (tab == 0) refreshStatus()
                }

                override fun onDestroy() {
                    handler.removeCallbacksAndMessages(null)
                    super.onDestroy()
                }

                private fun showTab(i: Int) {
                    handler.removeCallbacksAndMessages(null)
                    tab = i
                    val bar = tabBar ?: return
                    bar.removeAllViews()
                    val names = listOf("tab_home", "tab_profiles", "tab_modules", "tab_settings")
                    for ((idx, k) in names.withIndex()) {
                        val b = Button(this)
                        b.text = L.t(k)
                        b.typeface = Typeface.MONOSPACE
                        b.setAllCaps(false)
                        b.textSize = 11f
                        b.minWidth = 0
                        b.setPadding(dp(4), dp(10), dp(4), dp(10))
                        if (idx == i) {
                            b.background = outline(GREEN, CARD, 6)
                            b.setTextColor(GREEN)
                        } else {
                            b.setBackgroundColor(0)
                            b.setTextColor(DIM)
                        }
                        b.setOnClickListener { showTab(idx) }
                        bar.addView(b, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                    }
                    val c = content ?: return
                    c.removeAllViews()
                    c.addView(
                        when (i) {
                            0 -> tabHome()
                            1 -> tabProfiles()
                            2 -> tabModules()
                            else -> tabSettings()
                        }
                    )
                }

                // ---------------------------------------------------------------- onglet CORE
                private fun tabHome(): ScrollView {
                    val (sv, box) = newPage()
                    text(box, L.t("banner"), FAINT, 11f, 0)
                    text(box, L.t("prompt"), DIM, 11f, 2)
                    val title = text(box, "> WILDCRAFT BOT_", GREEN, 26f, 6)

                    // curseur clignotant
                    var on = true
                    val blink = object : Runnable {
                        override fun run() {
                            title.text = if (on) "> WILDCRAFT BOT_" else "> WILDCRAFT BOT "
                            on = !on
                            handler.postDelayed(this, 550)
                        }
                    }
                    handler.postDelayed(blink, 550)

                    // séquence de démarrage
                    val boot = text(box, "", FAINT, 11f, 6)
                    val acc = BotAccessibility.instance != null
                    val ov = Settings.canDrawOverlays(this)
                    val lines = listOf(
                        "> kernel.init ............ OK",
                        "> vision.ocr.mount ....... OK",
                        "> relay.access ........... " + (if (acc) "OK" else "WAIT"),
                        "> overlay.hud ............ " + (if (ov) "OK" else "WAIT"),
                        "> matrix.load [" + Store.active(this) + "] .. OK"
                    )
                    var idx = 0
                    val bootRun = object : Runnable {
                        override fun run() {
                            if (idx < lines.size) {
                                boot.append(lines[idx] + "\n")
                                idx++
                                handler.postDelayed(this, 130)
                            }
                        }
                    }
                    handler.postDelayed(bootRun, 150)

                    val st = text(box, "", GREEN, 13f, 10)
                    st.background = outline(DIM, PANEL, 8)
                    st.setPadding(dp(12), dp(10), dp(12), dp(10))
                    status = st

                    val s1 = section(box, L.t("sec_perm"), L.t("hint_perm"))
                    button(s1, L.t("b_overlay"), GREEN) {
                        startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                    }
                    button(s1, L.t("b_access"), GREEN) { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }

                    val s2 = section(box, L.t("sec_pos"), L.t("hint_pos"))
                    button(s2, L.t("b_3a"), CYAN) { calibrate("buttons") }
                    button(s2, L.t("b_3b"), CYAN) { calibrate("zone") }
                    button(s2, L.t("b_3c"), CYAN) { calibrate("self") }
                    button(s2, L.t("b_test"), AMBER) { testGestures() }

                    val s3 = section(box, L.t("sec_launch"), L.t("hint_launch"))
                    button(s3, L.t("b_start"), GREEN) { start() }
                    button(s3, L.t("b_quit"), RED) { quitBot() }
                    text(s3, L.t("tip_play"), FAINT, 11f, 10)
                    refreshStatus()
                    return sv
                }

                private fun statusLine(sb: SpannableStringBuilder, ok: Boolean, label: String, value: String) {
                    val start = sb.length
                    sb.append("● ")
                    sb.setSpan(ForegroundColorSpan(if (ok) GREEN else AMBER), start, start + 1, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                    sb.append(label).append(" : ").append(value).append("\n")
                }

                private fun lootCount(): Int =
                    try { JSONArray(cfg().getString("lootPts", "[]")).length() } catch (e: Exception) { 0 }

                private fun refreshStatus() {
                    val c = cfg()
                    val pos = c.contains("joyFX") && c.contains("btnFX")
                    val zt = c.contains("hp1FX") && c.contains("hp2FX")
                    val zs = c.contains("me1FX") && c.contains("me2FX")
                    val acc = BotAccessibility.instance != null
                    val n = lootCount()
                    val sb = SpannableStringBuilder()
                    statusLine(sb, true, L.t("st_matrix"), Store.active(this))
                    statusLine(sb, pos, L.t("st_pos"), if (pos) "OK" else L.t("unset"))
                    statusLine(sb, zt, L.t("st_zt"), if (zt) "OK" else L.t("unset"))
                    statusLine(sb, zs, L.t("st_zs"), if (zs) "OK" else L.t("unset"))
                    statusLine(sb, acc, L.t("st_acc"), if (acc) "ON" else "OFF")
                    statusLine(sb, n > 0, L.t("st_loot"), n.toString() + " " + L.t("steps"))
                    status?.text = sb
                }

                // ---------------------------------------------------------------- onglet MATRIX (profils)
                private fun tabProfiles(): ScrollView {
                    val (sv, box) = newPage()
                    text(box, L.t("tab_profiles"), GREEN, 22f, 0)
                    val list = section(box, L.t("sec_profiles"), L.t("hint_profiles"))
                    val active = Store.active(this)
                    for (name in Store.profiles(this)) {
                        val row = LinearLayout(this)
                        row.orientation = LinearLayout.HORIZONTAL
                        val isActive = name == active
                        val b = Button(this)
                        b.text = (if (isActive) "● " else "○ ") + name + (if (isActive) "   [" + L.t("prof_active") + "]" else "")
                        styled(b, if (isActive) GREEN else DIM)
                        b.setOnClickListener { Store.setActive(this, name); showTab(1) }
                        row.addView(b, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                        if (!isActive) {
                            val d = Button(this)
                            d.text = "✕"
                            styled(d, RED)
                            d.gravity = Gravity.CENTER
                            d.setOnClickListener { confirmDelete(name) }
                            val l = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                            l.leftMargin = dp(8)
                            row.addView(d, l)
                        }
                        list.addView(row, lp(8))
                    }

                    val s2 = section(box, L.t("prof_new"), "")
                    val et = EditText(this)
                    et.hint = L.t("prof_name")
                    et.setHintTextColor(DIM)
                    et.setTextColor(GREEN)
                    et.typeface = Typeface.MONOSPACE
                    et.background = outline(DIM, PANEL, 4)
                    et.setPadding(dp(12), dp(8), dp(12), dp(8))
                    et.setSingleLine(true)
                    s2.addView(et, lp(8))
                    button(s2, L.t("prof_create"), GREEN) {
                        val n = et.text.toString().trim()
                        if (n.isEmpty()) toast("prof_empty")
                        else if (Store.exists(this, n)) toast("prof_exists")
                        else { Store.add(this, n); Store.setActive(this, n); showTab(1) }
                    }
                    button(s2, L.t("prof_dup"), CYAN) {
                        var n = active + " 2"
                        var k = 2
                        while (Store.exists(this, n)) { k++; n = active + " " + k }
                        Store.duplicate(this, active, n)
                        Store.setActive(this, n)
                        showTab(1)
                    }
                    return sv
                }

                private fun confirmDelete(name: String) {
                    AlertDialog.Builder(this, android.R.style.Theme_Material_Dialog_Alert)
                        .setMessage(L.t("prof_del_q") + "\n" + name)
                        .setPositiveButton(L.t("yes")) { _, _ -> Store.delete(this, name); showTab(1) }
                        .setNegativeButton(L.t("no"), null)
                        .show()
                }

                // ---------------------------------------------------------------- onglet MODULES
                private fun tabModules(): ScrollView {
                    val (sv, box) = newPage()
                    text(box, L.t("tab_modules"), GREEN, 22f, 0)

                    val sv1 = section(box, L.t("sec_vitals"), L.t("hint_vitals"))
                    switchRow(sv1, "mod_surv", "surv", 0)
                    numField(sv1, "set_big", "hpBig", 100000)
                    numField(sv1, "set_low", "selfLow", 40)
                    numField(sv1, "set_resume", "selfResume", 70)
                    text(sv1, L.t("set_flee"), SOFT, 12f, 14)
                    compass(sv1, "dirFlee", 180)
                    button(sv1, L.t("b_3c"), CYAN) { calibrate("self") }

                    val sl = section(box, L.t("sec_loot"), L.t("hint_loot"))
                    switchRow(sl, "mod_loot", "loot", 0)
                    text(sl, "# " + lootCount() + " " + L.t("steps"), FAINT, 11f, 8)
                    button(sl, L.t("b_seq_rec"), CYAN) { calibrate("loot") }
                    numField(sl, "set_lstart", "lootStart", 2000)
                    numField(sl, "set_ldelay", "lootDelay", 800)
                    numField(sl, "set_lrepeat", "lootRepeat", 1)
                    button(sl, L.t("b_seq_test"), AMBER) { testLoot() }
                    return sv
                }

                // ---------------------------------------------------------------- onglet SYS
                private fun tabSettings(): ScrollView {
                    val (sv, box) = newPage()
                    text(box, L.t("tab_settings"), GREEN, 22f, 0)

                    val sl = section(box, L.t("sec_lang"), "")
                    choices(sl, listOf("Français", "English"), if (L.lang == "en") 1 else 0, 2) { i ->
                        L.set(this, if (i == 1) "en" else "fr")
                        showTab(3)
                    }

                    val sd = section(box, L.t("sec_detect"), L.t("hint_detect"))
                    numField(sd, "set_hpboss", "hpBoss", 10000)
                    numField(sd, "set_miss", "bossMiss", 4)

                    val sb = section(box, L.t("sec_boss"), L.t("hint_boss"))
                    switchRow(sb, "set_fixed", "fixed", 1)
                    text(sb, L.t("set_dir"), SOFT, 12f, 14)
                    compass(sb, "dir", 0)
                    val rv = text(sb, L.t("set_radius") + " : " + cfg().getInt("radius", 90), SOFT, 12f, 16)
                    val seek = SeekBar(this)
                    seek.max = 280
                    seek.progress = cfg().getInt("radius", 90) - 20
                    seek.progressTintList = ColorStateList.valueOf(GREEN)
                    seek.thumbTintList = ColorStateList.valueOf(GREEN)
                    seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                        override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                            cfg().edit().putInt("radius", p + 20).apply()
                            rv.text = L.t("set_radius") + " : " + (p + 20)
                        }
                        override fun onStartTrackingTouch(s: SeekBar?) {}
                        override fun onStopTrackingTouch(s: SeekBar?) {}
                    })
                    sb.addView(seek, lp(4))
                    switchRow(sb, "set_atk", "atkBoss", 0)
                    return sv
                }

                // ---------------------------------------------------------------- actions
                private fun quitBot() {
                    val s = Intent(this, BotService::class.java)
                    s.action = "STOP"
                    startService(s)
                    toast("t_stopped")
                }

                private fun calibrate(mode: String) {
                    if (!Settings.canDrawOverlays(this)) { toast("t_overlay"); return }
                    val cs = Intent(this, CalibService::class.java)
                    cs.putExtra("mode", mode)
                    startService(cs)
                    toast("t_calib")
                    moveTaskToBack(true)
                }

                @Suppress("DEPRECATION")
                private fun testGestures() {
                    val c = cfg()
                    val acc = BotAccessibility.instance
                    if (acc == null) { toast("t_access"); return }
                    if (!c.contains("joyFX") || !c.contains("btnFX")) { toast("t_pos"); return }
                    val dm = DisplayMetrics()
                    windowManager.defaultDisplay.getRealMetrics(dm)
                    val jx = (c.getFloat("joyFX", 15f) * dm.widthPixels / 100f).toInt()
                    val jy = (c.getFloat("joyFY", 70f) * dm.heightPixels / 100f).toInt()
                    val bx = (c.getFloat("btnFX", 90f) * dm.widthPixels / 100f).toInt()
                    val by = (c.getFloat("btnFY", 70f) * dm.heightPixels / 100f).toInt()
                    val r = c.getInt("radius", 90)
                    val rad = Math.toRadians(c.getInt("dir", 0).toDouble())
                    val tx = jx + (r * Math.cos(rad)).toInt()
                    val ty = jy + (r * Math.sin(rad)).toInt()
                    toast("t_test")
                    moveTaskToBack(true)
                    Thread {
                        try {
                            Thread.sleep(8000)
                            acc.tap(bx, by)
                            Thread.sleep(1500)
                            val end = System.currentTimeMillis() + 3000
                            acc.holdDirection(jx, jy, tx, ty, bx, by, false) { System.currentTimeMillis() < end }
                            acc.tap(jx, jy)
                        } catch (e: Exception) {}
                    }.start()
                }

                @Suppress("DEPRECATION")
                private fun testLoot() {
                    val c = cfg()
                    val acc = BotAccessibility.instance
                    if (acc == null) { toast("t_access"); return }
                    val pts = try { JSONArray(c.getString("lootPts", "[]")) } catch (e: Exception) { JSONArray() }
                    if (pts.length() == 0) { toast("t_noseq"); return }
                    val dm = DisplayMetrics()
                    windowManager.defaultDisplay.getRealMetrics(dm)
                    val delay = c.getInt("lootDelay", 800).toLong()
                    val repeat = c.getInt("lootRepeat", 1).coerceIn(1, 30)
                    toast("t_test")
                    moveTaskToBack(true)
                    Thread {
                        try {
                            Thread.sleep(8000)
                            for (r in 0 until repeat) {
                                for (i in 0 until pts.length()) {
                                    val p = pts.getJSONArray(i)
                                    acc.tap((p.getDouble(0) * dm.widthPixels / 100.0).toInt(), (p.getDouble(1) * dm.heightPixels / 100.0).toInt())
                                    Thread.sleep(delay)
                                }
                            }
                        } catch (e: Exception) {}
                    }.start()
                }

                private fun start() {
                    val c = cfg()
                    if (!Settings.canDrawOverlays(this)) { toast("t_overlay"); return }
                    if (BotAccessibility.instance == null) { toast("t_access"); return }
                    if (!c.contains("joyFX") || !c.contains("btnFX")) { toast("t_pos"); return }
                    if (!c.contains("hp1FX") || !c.contains("hp2FX")) { toast("t_zone"); return }
                    val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                    startActivityForResult(mpm.createScreenCaptureIntent(), REQ_CAPTURE)
                }

                override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                    super.onActivityResult(requestCode, resultCode, data)
                    if (resultCode != RESULT_OK || data == null) return
                    if (requestCode == REQ_CAPTURE) {
                        val s = Intent(this, BotService::class.java)
                        s.putExtra("code", resultCode)
                        s.putExtra("data", data)
                        startForegroundService(s)
                        toast("t_open")
                    }
                }
            }
            WCEOF
            mkdir -p app/src/main/java/com/example/wcbot
            cat > app/src/main/java/com/example/wcbot/Store.kt <<'WCEOF'
            package com.example.wcbot

            import android.content.Context
            import android.content.SharedPreferences
            import org.json.JSONArray

            /** Profils : chaque profil a son propre fichier de réglages (positions, réglages, commandes). */
            object Store {
                private fun app(ctx: Context): SharedPreferences = ctx.getSharedPreferences("app", Context.MODE_PRIVATE)

                fun profiles(ctx: Context): MutableList<String> {
                    val out = ArrayList<String>()
                    try {
                        val arr = JSONArray(app(ctx).getString("profiles", "[\"Solo\",\"Multi\"]"))
                        for (i in 0 until arr.length()) out.add(arr.getString(i))
                    } catch (e: Exception) {}
                    if (out.isEmpty()) { out.add("Solo"); out.add("Multi") }
                    return out
                }

                private fun saveProfiles(ctx: Context, list: List<String>) {
                    val arr = JSONArray()
                    for (p in list) arr.put(p)
                    app(ctx).edit().putString("profiles", arr.toString()).apply()
                }

                fun active(ctx: Context): String {
                    val a = app(ctx).getString("active", "Solo") ?: "Solo"
                    val list = profiles(ctx)
                    return if (list.contains(a)) a else list[0]
                }

                fun setActive(ctx: Context, name: String) {
                    app(ctx).edit().putString("active", name).apply()
                }

                private fun key(name: String): String = name.lowercase().filter { it.isLetterOrDigit() }

                fun exists(ctx: Context, name: String): Boolean = profiles(ctx).any { key(it) == key(name) }

                fun cfgOf(ctx: Context, name: String): SharedPreferences {
                    val file = if (name == "Solo") "cfg" else "cfg_" + key(name).ifEmpty { "x" }
                    return ctx.getSharedPreferences(file, Context.MODE_PRIVATE)
                }

                /** Réglages du profil actif. */
                fun cfg(ctx: Context): SharedPreferences = cfgOf(ctx, active(ctx))

                fun add(ctx: Context, name: String) {
                    val list = profiles(ctx)
                    list.add(name)
                    saveProfiles(ctx, list)
                }

                fun delete(ctx: Context, name: String) {
                    val list = profiles(ctx)
                    list.remove(name)
                    cfgOf(ctx, name).edit().clear().apply()
                    saveProfiles(ctx, list)
                }

                fun duplicate(ctx: Context, from: String, to: String) {
                    val src = cfgOf(ctx, from).all
                    val e = cfgOf(ctx, to).edit()
                    e.clear()
                    for ((k, v) in src) {
                        when (v) {
                            is Int -> e.putInt(k, v)
                            is Float -> e.putFloat(k, v)
                            is Long -> e.putLong(k, v)
                            is Boolean -> e.putBoolean(k, v)
                            is String -> e.putString(k, v)
                        }
                    }
                    e.apply()
                    add(ctx, to)
                }
            }
            WCEOF
